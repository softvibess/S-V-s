<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sᴏғᴛ Vɪʙᴇs</title>

  <style>
    body{
      margin:0;
      font-family: Tahoma, Arial, system-ui;
      background: linear-gradient(135deg,#eef1ff,#dfe4ff);
      color:#111;
    }

    .container{
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    /* بانر */
    .banner{
      height: 260px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }
    .banner img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    /* الاسم الذهبي */
    .gold-name{
      margin: 18px 0 8px;
      text-align:center;
      font-weight: 900;
      font-size: 54px;
      letter-spacing: 1px;
      background: linear-gradient(90deg,#007cf0,#007cf0,#007cf0,#007cf0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 16px rgba(25, 0, 255, 0.55);
    }

    /* الشبكة */
    .grid{
      display:grid;
      grid-template-columns: 1fr 320px;
      gap: 18px;
      margin-top: 14px;
      align-items:start;
    }

    .card{
      background: rgba(255,255,255,.92);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    .btn{
      display:block;
      text-align:center;
      padding: 14px 14px;
      border-radius: 12px;
      font-weight: 800;
      text-decoration:none;
      margin-bottom: 10px;
      transition: .18s;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-2px); }

    .join{ background:#5865F2; color:#fff; }
    .copy{ background:#111; color:#fff; cursor:pointer; }

    /* ABOUT */
    .about-box h2{
      margin: 0 0 10px;
      font-size: 18px;
      font-weight: 900;
    }
    .about-box p{ margin: 8px 0; line-height: 1.9; }
    .about-box hr{
      border:0;
      height:1px;
      background: rgba(0,0,0,.12);
      margin: 14px 0;
    }

    /* المميزين - تبديل */
    .vip-rotator{
      display:flex;
      align-items:center;
      gap: 12px;
      background: rgba(243,245,255,.9);
      border-radius: 14px;
      padding: 12px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
    }

    .vip-avatar{
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      flex: 0 0 auto;
      box-shadow: 0 6px 14px rgba(0,0,0,.10);
    }

    .vip-text{
      min-width:0;
      text-align:right;
      flex:1;
    }

    .vip-label{
      font-size: 12px;
      color:#555;
      margin-bottom: 2px;
    }

    .vip-name{
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* نقطة أونلاين شكل */
    .vip-status{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background:#23d160;
      box-shadow: 0 0 0 3px rgba(35,209,96,.18);
      flex:0 0 auto;
    }

    /* حركة تبديل ناعمة */
    .fade{
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn{
      from{ opacity:0; transform: translateY(4px); }
      to{ opacity:1; transform: translateY(0); }
    }

    @media (max-width: 860px){
      .grid{ grid-template-columns: 1fr; }
      .gold-name{ font-size: 44px; }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="banner">
      <img src="https://cdn.discordapp.com/attachments/1470387235374501910/1471138069477462246/background_1.webp?ex=698dd798&is=698c8618&hm=389ec1e480cb8d519585b090c13979138ad875866b6becc867cfb6b79a0d544b&" alt="banner">
    </div>

    <div class="gold-name">Sᴏғᴛ Vɪʙᴇs</div>

    <div class="grid">

      <!-- يسار -->
      <div class="card about-box">
        <h2>حول السيرفر</h2>

        <p>🎉 أهلاً وسهلاً بك في سيرفرنا!</p>
        <p>👑 المالكين: Q8 &amp; ™sonic</p>
        <p>😎 مكان للسوالف والضحك والتعارف</p>
        <p>🎮 ألعاب | 💬 دردشة | 🎙️ صوتيات | 🎯 فعاليات</p>
        <p>🚀 انضم وعيش الأجواء معنا ✨</p>

        <hr>

        <h2>🌟 المميز الحالي</h2>

        <!-- المربع اللي يتبدّل -->
        <div class="vip-rotator" id="vipBox">
          <img class="vip-avatar" id="vipAvatar" src="" alt="vip">
          <div class="vip-text">
            <div class="vip-label"> ✨مميزين </div>
            <div class="vip-name" id="vipName"></div>
          </div>
          <div class="vip-status" title="Online"></div>
        </div>
      </div>

      <!-- يمين -->
      <div>
        <a class="btn join" href="https://discord.gg/sv3" target="_blank">🚀 دخول الديسكورد</a>

        <div class="btn copy" id="copyBtn">📋 نسخ رابط الدعوة</div>

        <div class="card" style="margin-top:12px">
          <h3 style="margin:0 0 10px;font-size:16px;font-weight:900;">🎯 اهتمامات</h3>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <span style="background:#eef1ff;padding:8px 12px;border-radius:999px;">ألعاب</span>
            <span style="background:#eef1ff;padding:8px 12px;border-radius:999px;">دردشة</span>
            <span style="background:#eef1ff;padding:8px 12px;border-radius:999px;">مجتمع</span>
            <span style="background:#eef1ff;padding:8px 12px;border-radius:999px;">فعاليات</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ====== عدّل الأعضاء من هنا فقط ======
    const members = [
      { name: "R🦋",     avatar: "https://cdn.discordapp.com/avatars/1411818206204792924/f4251195665b3eb048209bfc6e0ac228.webp?size=1024" },
      { name: "MaDaQsh", avatar: "https://cdn.discordapp.com/avatars/1386408483884109844/7c19bdad9fd349ef269404c2d8199373.webp?size=1024" },
      { name: "Q8", avatar: "https://cdn.discordapp.com/avatars/1449612903907987499/ed4a5dc36ebd6bf38511c044b730c6eb.webp?size=1024" }
    ];
    // ====================================

    let i = 0;

    function showMember(){
      const vipAvatar = document.getElementById("vipAvatar");
      const vipName   = document.getElementById("vipName");
      const vipBox    = document.getElementById("vipBox");

      vipBox.classList.remove("fade"); // لإعادة تشغيل الأنميشن
      void vipBox.offsetWidth;

      vipAvatar.src = members[i].avatar;
      vipName.textContent = members[i].name;

      vipBox.classList.add("fade");

      i = (i + 1) % members.length;
    }

    // أول عرض + تبديل كل 7 ثواني
    showMember();
    setInterval(showMember, 7000);

    // زر نسخ رابط الدعوة
    document.getElementById("copyBtn").addEventListener("click", () => {
      const link = "https://discord.gg/sv3";
      navigator.clipboard.writeText(link);
      alert("تم نسخ الرابط ✅");
    });
  </script>
</body>
</html>
